<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnos</title>
    <meta name="description" content="Lista de alumnos">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="contenedor">
        <h1>Alumnos</h1>

        <section class="tarjeta">
            <h2>Datos del alumno</h2>
            <form id="alumno-form">
                <div class="campo">
                    <label for="campo-studentid">Matrícula</label>
                    <input type="text" id="campo-studentid" maxlength="10" required>
                </div>
                <div class="campo">
                    <label for="campo-name">Nombre</label>
                    <input type="text" id="campo-name" maxlength="50" required>
                </div>
                <div class="campo">
                    <label for="campo-lastname">Apellido</label>
                    <input type="text" id="campo-lastname" maxlength="30">
                </div>
                <div class="campo">
                    <label for="campo-email">Email</label>
                    <input type="email" id="campo-email" maxlength="50">
                </div>
                <div class="botones">
                    <button type="submit" id="guardar-btn">Agregar</button>
                    <button type="button" id="cancelar-btn" class="btn-secundario" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <section class="tarjeta">
            <div class="encabezado-lista">
                <h2>Listado</h2>
                <form id="buscar-form">
                    <input type="number" id="buscar-id" placeholder="Buscar por ID" aria-label="Buscar por ID"
                        min="1" required>
                    <button type="submit" class="btn-secundario">Buscar</button>
                    <button type="button" id="ver-todos-btn" class="btn-secundario">Ver todos</button>
                </form>
            </div>
            <div id="alumnos-container">
                <table id="alumnos-table">
                    <thead>
                        <tr>
                            <th>Matrícula</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="alumnos-tbody"></tbody>
                </table>
            </div>
        </section>

        <section class="tarjeta">
            <div class="grafica">
                <canvas id="alumnos-chart"></canvas>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
